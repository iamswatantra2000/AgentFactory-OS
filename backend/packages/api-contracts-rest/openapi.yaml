openapi: 3.1.0
info:
  title: AgentFactory OS Gateway REST API
  version: 0.1.0
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Required dependencies are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: A required dependency is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/session/status:
    get:
      operationId: getSessionStatus
      responses:
        '200':
          description: Current browser session status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '503':
          description: Identity service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/signup:
    post:
      operationId: signUp
      description: Creates an owner account, workspace, and server-side session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '201':
          description: Account created. Sets an HttpOnly af_session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/auth/login:
    post:
      operationId: logIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Signed in. Sets an HttpOnly af_session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/auth/logout:
    post:
      operationId: logOut
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Session revoked and cookie cleared.
        '503':
          $ref: '#/components/responses/ProblemResponse'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: af_session
  responses:
    ProblemResponse:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SessionUser:
      type: object
      required: [id, email, name, workspaceId]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
        workspaceId:
          type: [string, 'null']
          format: uuid
    SessionStatus:
      oneOf:
        - type: object
          required: [authenticated]
          properties:
            authenticated:
              const: false
        - type: object
          required: [authenticated, user]
          properties:
            authenticated:
              const: true
            user:
              $ref: '#/components/schemas/SessionUser'
    AuthSuccess:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
